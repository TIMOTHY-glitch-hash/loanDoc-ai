[project]
name = "loandoc-api"
version = "0.1.0"
description = "LoanDoc AI backend: document ingestion, classification and field extraction"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-multipart>=0.0.18,<0.1.0",
    "langchain>=0.3.27,<0.4.0",
    "langchain-openai>=0.3.0,<0.4.0",
    "pypdf>=5.1.0,<6.0.0",
    # Runtime dependency now: memo persistence calls Convex's HTTP mutation API.
    "httpx>=0.27.0,<0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.8.0,<0.9.0",
    "mypy>=1.13.0,<2.0.0",
    "pytest-asyncio>=0.24.0,<1.2.0",
    # Test-only: generates real multi-page PDFs so page splitting is exercised.
    "reportlab>=4.2.0,<5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Chosen to mirror the strictness of the TypeScript side: pyflakes, pycodestyle,
# isort, bugbear, comprehensions, pyupgrade and pep8-naming.
select = ["E", "F", "I", "B", "C4", "UP", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets async tests be plain `async def` without a per-test marker.
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[[tool.mypy.overrides]]
# reportlab (test-only PDF generation) ships no type stubs.
module = ["reportlab.*"]
ignore_missing_imports = true
